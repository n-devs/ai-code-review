name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build action
        run: npm run build

      - name: Ensure committed dist is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit the result"
            exit 1
          fi
