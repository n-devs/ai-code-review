name: Test AI Code Review Action

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string
      provider:
        description: "AI provider"
        required: false
        type: choice
        default: "github-azure-models"
        options:
          - github-azure-models
          - github-models
          - copilot
          - openai
          - anthropic
          - openrouter
          - ollama
          - xai
          - zai
          - qwencloud
          - qwencloud-plan
          - google
          - azure
          - aws
          - custom
      model:
        description: "AI model name (e.g. gpt-4o, openai/gpt-4o-mini, claude-3-5-sonnet-20241022)"
        required: false
        default: "gpt-4o"
        type: string
      api_key:
        description: "AI API key (leave empty to use GITHUB_TOKEN)"
        required: false
        default: ""
        type: string
      files_changed:
        description: "Post inline review comments on changed files (Files changed tab)"
        required: false
        default: false
        type: boolean
      username:
        description: "Review only changes by this GitHub username ('all' = everyone, empty = you)"
        required: false
        default: ""
        type: string
      mode:
        description: "Model mode (thinking enables reasoning mode)"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - thinking
      effort:
        description: "Reasoning effort (none = don't send)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - low
          - medium
          - high
          - max
      agents:
        description: "Review agents: all, or comma-separated (author,primary,specialist,checklist + custom names), empty = custom only / single review"
        required: false
        default: "all"
        type: string
      custom_agents:
        description: 'Custom agents as JSON array, e.g. [{"name":"db","label":"🗄️ DBA","persona":"You are a DBA..."}] — same name as built-in = override'
        required: false
        default: ""
        type: string
      skills:
        description: "Skills for agents: auto, all, comma-separated names, or empty to disable"
        required: false
        default: "auto"
        type: string
      custom_skills:
        description: 'Custom skills as JSON array [{"name":"...","description":"...","content":"..."}]'
        required: false
        default: ""
        type: string
      web_search:
        description: "Let the AI search the web during review (model must support tools)"
        required: false
        default: false
        type: boolean

permissions:
  pull-requests: write
  contents: read
  models: read

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    steps:
      # อ่าน key จาก event payload แทน env/expression เพราะ GitHub พิมพ์ค่า env ของ step
      # ลง log ก่อนที่ add-mask จะทำงาน
      - name: Mask API key in logs
        if: ${{ inputs.api_key != '' }}
        run: |
          key=$(jq -r '.inputs.api_key // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build action
        run: npm ci && npm run build

      - name: Run AI Code Review
        uses: ./
        with:
          gh_pat: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          api_key: ${{ inputs.api_key || secrets.GITHUB_TOKEN }}
          files_changed: ${{ inputs.files_changed }}
          username: ${{ inputs.username || github.actor }}
          mode: ${{ inputs.mode || 'normal' }}
          effort: ${{ inputs.effort != 'none' && inputs.effort || '' }}
          agents: ${{ inputs.agents }}
          custom_agents: ${{ inputs.custom_agents }}
          skills: ${{ inputs.skills }}
          custom_skills: ${{ inputs.custom_skills }}
          web_search: ${{ inputs.web_search }}
          language: Thai
          max_tokens: 128000
          max_diff_chars: 1000000
