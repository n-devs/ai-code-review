name: "AI Code Review by n-devs"
description: "Automated PR code review powered by GitHub Models, Copilot, OpenAI, Anthropic, and more"
author: "ai-code-review"

inputs:
  gh_pat:
    description: "GitHub Personal Access Token with Copilot access"
    required: true
  repo:
    description: "Repository in owner/repo format"
    required: true
  pr_number:
    description: "Pull request number to review"
    required: true
  api_key:
    description: "API key for the selected provider. For copilot: provide a personal GitHub PAT with Copilot subscription (GITHUB_TOKEN will not work — it lacks Copilot access)"
    required: true
  title:
    description: "Title for the code review comment"
    required: false
    default: "AI Code Review"
  model:
    description: "AI model to use (e.g. gpt-4o, claude-3-5-sonnet-20241022, llama3)"
    required: false
    default: "gpt-4o"
  provider:
    description: "AI provider shorthand: copilot, github-models, openai, anthropic, openrouter, ollama, xai, zai, qwencloud, qwencloud-plan, google, azure, aws, custom — sets api_url and api_type defaults automatically (azure/aws require api_url). Use github-models to authenticate with GITHUB_TOKEN without needing a personal PAT."
    required: false
    default: "github-azure-models"
  api_url:
    description: "Full API endpoint URL (e.g. https://api.anthropic.com/v1/messages). Overrides provider + api_type defaults when set."
    required: false
  api_type:
    description: "API type: 'chat' (Chat Completions), 'responses' (OpenAI Responses API), or 'messages' (Anthropic Messages API)"
    required: false
    default: "chat"
  max_tokens:
    description: "Maximum number of tokens in the AI response"
    required: false
    default: "4096"
  max_diff_chars:
    description: "Maximum number of characters of diff to send to Copilot"
    required: false
    default: "10000"
  language:
    description: "Language for the code review response (e.g. English, Thai, Japanese)"
    required: false
    default: "English"
  files_changed:
    description: "Set to 'true' to have the AI review each changed file and post inline review comments on the diff (Files changed tab) instead of one combined PR comment"
    required: false
    default: "false"
  max_comments:
    description: "Max inline review comments (files_changed mode). 0 or empty (default) = no limit — posts every comment. When set to a number > 0, the quota is distributed round-robin across agents."
    required: false
    default: ""
  username:
    description: "GitHub username whose changes to review — only files changed in commits authored by this user are reviewed, and the user is @mentioned in the review comment. Use 'all' to review everyone — each author is then @mentioned with their files. Defaults to the user who triggered the workflow run (GITHUB_ACTOR)."
    required: false
    default: ""
  mode:
    description: "Model reasoning mode: 'thinking' enables thinking/reasoning mode for models that support it (enable_thinking for OpenAI-compatible chat, thinking block for Anthropic messages). 'normal' (default) sends no extra params."
    required: false
    default: "normal"
  effort:
    description: "Reasoning effort for thinking models: low, medium, high, or max — adds reasoning_effort (chat), reasoning.effort (responses), or maps to the thinking budget (messages). Empty or 'none' (default) sends nothing."
    required: false
    default: ""
  agents:
    description: "Multi-agent review: 'all' or comma-separated list — built-ins: author, primary, specialist, checklist; plus any names from custom_agents/agents_path. Empty (default) = single combined agent."
    required: false
    default: ""
  agents_path:
    description: "Load/override agents from a folder of <agent-name>.md files in your repo (e.g. .github/agents). First line '# Label' is the display label; the rest is the persona. Same name overrides a built-in; new names add agents."
    required: false
    default: ""
  custom_agents:
    description: "Customize or add agents as a JSON array: [{\"name\": \"primary\", \"persona\": \"...\"}] overrides a built-in agent (author/primary/specialist/checklist); a new name adds a new agent. Optional 'label' is shown in the report. Refer to custom names in 'agents', or 'all' to run everything."
    required: false
    default: ""
  skills:
    description: "Skills injected into every agent's prompt: comma-separated skill names, 'all', 'auto' (picked by diff content), or empty to disable. Built-ins: security, testing, performance, clean-code, error-handling, api-contract — plus any custom_skills/skills_path entries."
    required: false
    default: ""
  custom_skills:
    description: "Add your own skills as a JSON array: [{\"name\": \"k8s\", \"description\": \"...\", \"content\": \"- check ...\"}]. 'name' and 'content' required."
    required: false
    default: ""
  skills_path:
    description: "Import skills from a folder of markdown files in the repo (e.g. .github/ai-skills). Each *.md file becomes a skill named after the file; an optional first-line '# Title' is its description."
    required: false
    default: ""
  memory:
    description: "Set to 'true' to enable review memory: loads context.md + the latest <date>-context.md files from context_path and the bot's previous comments on the PR (no repeat reports), then after the run saves a new AI-generated memory file <today>-context.md back to the repo (requires contents: write permission)."
    required: false
    default: "false"
  context_path:
    description: "Folder (in the repo) holding memory files: context.md (stable base) and <date>-context.md (daily memory)."
    required: false
    default: ".github/ai-review"
  memory_files:
    description: "Which dated memory files to load: a number = latest N files (e.g. 3), specific dates comma-separated (e.g. 2026-10-25,2026-10-28), or a date range (e.g. 2026-10-20..2026-10-28)."
    required: false
    default: "3"
  web_search:
    description: "Set to 'true' to let the AI search the web during review. Uses native web search for Anthropic messages / OpenAI responses, and a web_search function-calling loop (DuckDuckGo, no key needed) for chat/GitHub Models. Requires a model/provider that supports tools."
    required: false
    default: "false"

runs:
  using: "node24"
  main: "dist/index.js"
